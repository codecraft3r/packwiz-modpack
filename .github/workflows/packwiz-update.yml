name: Packwiz Auto-Update
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install source-render dependencies
        run: python -m pip install 'Pillow>=12,<13'

      - name: Validate campaign before export
        run: |
          python scripts/validate_snbt.py config/
          python scripts/test_validate_snbt.py
          python -m unittest discover -s scripts -p 'test_vvh*.py'
          python scripts/vvh_campaign_v3.py --root . --check
          python scripts/vvh_campaign_v3_validate.py --root . --output /tmp/vvh-campaign-validation.json
          python scripts/vvh_sync_catalog.py --check .
        
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          
      - name: Install packwiz
        run: |
          git clone --depth=1 https://github.com/packwiz/packwiz.git /tmp/packwiz
          (cd /tmp/packwiz && go install .)
        
      - name: Refresh index
        run: packwiz refresh

      - name: Require a stable generated index
        run: git diff --exit-code -- index.toml pack.toml
        
      - name: Create Modrinth export
        run: |
          mkdir -p dist
          packwiz modrinth export -o "dist/Poiesis-2-${GITHUB_REF_NAME:-snapshot}.mrpack"
          
      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.mrpack
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
