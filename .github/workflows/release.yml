name: Build CurseForge Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate pack and SNBT
        run: |
          python scripts/validate_colony.py
          python scripts/validate_snbt.py config/
          python scripts/test_validate_snbt.py
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@v0.0.0-20260906154125-ef87d964f8cb
      - name: Verify Packwiz index
        run: |
          packwiz refresh
          git diff --exit-code -- index.toml pack.toml
          packwiz refresh
          git diff --exit-code -- index.toml pack.toml
      - name: Export CurseForge pack
        run: |
          mkdir -p dist
          packwiz curseforge export -o dist/Createa-Colony-4.0.0-CurseForge.zip
        env:
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: Createa-Colony-4.0.0-CurseForge-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
