name: Validate Create'a Colony

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate upstream coverage and required mods
        run: python scripts/validate_colony.py
      - name: Validate SNBT grammar
        run: python scripts/validate_snbt.py config/
      - name: Run SNBT validator tests
        run: python scripts/test_validate_snbt.py
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@v0.0.0-20260906154125-ef87d964f8cb
      - name: Verify Packwiz index and stable refresh
        run: |
          packwiz refresh
          packwiz list
          git diff --exit-code -- index.toml pack.toml
          packwiz refresh
          git diff --exit-code -- index.toml pack.toml
          test -z "$(git status --porcelain)"
