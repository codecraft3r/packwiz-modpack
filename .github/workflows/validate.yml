name: Validate Packwiz and VvH

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate SNBT grammar
        run: python scripts/validate_snbt.py config/

      - name: Run SNBT validator tests
        run: python scripts/test_validate_snbt.py

      - name: Check authoritative VvH generation
        run: python scripts/vvh_campaign_v3.py --check

      - name: Run VvH graph, parity, and economy audit
        run: python scripts/vvh_campaign_v3_validate.py --output /tmp/vvh-campaign-validation.json

      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Refresh Packwiz index
        run: packwiz refresh

      - name: List Packwiz entries
        run: packwiz list

      - name: Verify second refresh is stable
        run: packwiz refresh

      - name: Check for uncommitted changes
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: generated campaign or Packwiz index is out of date."
            git status
            git diff
            exit 1
          fi
