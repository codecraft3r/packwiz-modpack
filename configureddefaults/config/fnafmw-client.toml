	item_group_icon_size = 6
	#config.fnafmw.item_groups_in_search.tooltip
	item_groups_in_search = false

#config.fnafmw.accessibility.tooltip
[accessibility]
	#config.fnafmw.flashing_lights.tooltip
	flashing_lights = false

#config.fnafmw.sound.tooltip
