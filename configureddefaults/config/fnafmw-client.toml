	#config.fnafmw.voicelines.tooltip
	voicelines = true
	#config.fnafmw.spotted_sound.tooltip
	spotted_sound = true

#config.fnafmw.integrations.tooltip
[integrations]
	#config.fnafmw.discord_rich_presence.tooltip
	discord_rich_presence = false
