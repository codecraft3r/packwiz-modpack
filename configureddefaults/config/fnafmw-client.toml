	custom_main_menu = false
	#config.fnafmw.show_social_icons.tooltip
	show_social_icons = true
	#config.fnafmw.show_bisect_button.tooltip
	show_bisect_button = true
	#config.fnafmw.custom_loading_screen.tooltip
	custom_loading_screen = false
	#config.fnafmw.custom_app_icon.tooltip
	custom_app_icon = false
